<!-- front/index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecProVVS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-play-circle"></i> SecProVVS
            </a>
            <div class="auth-buttons">
                <button id="login-btn" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> ログイン
                </button>
                <button id="logout-btn" class="btn-logout" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> ログアウト
                </button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="search-container">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="動画を検索..." />
                <button id="search-btn" class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <div class="channel-create-section" id="channel-create-section" style="display: none;">
            <div class="form-container">
                <div class="form-title">
                    <i class="fas fa-plus-circle"></i>
                    チャンネルを作成
                </div>
                <p class="form-description">
                    動画をアップロードするには、まずチャンネルを作成してください。
                </p>
                <a href="channel-create.html" class="form-button">
                    <i class="fas fa-plus"></i> チャンネル作成
                </a>
            </div>
        </div>

        <!-- Video Grid -->
        <div id="video-list" class="video-grid">
            <!-- Videos will be loaded here -->
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading-container" style="display: none;">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>動画を読み込み中...</p>
            </div>
        </div>

        <!-- No Results -->
        <div id="no-results" class="no-results" style="display: none;">
            <i class="fas fa-search"></i>
            <h3>検索結果が見つかりません</h3>
            <p>別のキーワードで検索してみてください。</p>
        </div>
    </main>

    <script src="data/videos.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
